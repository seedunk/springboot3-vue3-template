spring.web.resources.static-locations=classpath:/static/,classpath:/public/

# 是否启用静态资源映射（默认 true）
spring.web.resources.add-mappings=true

# 缓存策略
spring.web.resources.cache.period=3600
spring.web.resources.chain.cache=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.ai.deepseek.api-key=DEEPSEEK_API_TOKEN
spring.ai.deepseek.chat.options.model=deepseek-chat
spring.ai.deepseek.chat.options.temperature=0.7
spring.ai.deepseek.chat.options.internal-tool-execution-enabled=false
spring.autoconfigure.exclude=org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration
#PostgreSQL 数据源配置 ==========

spring.datasource.driver-class-name=org.postgresql.Driver
 
# 开启下划线转驼峰
spring.jackson.property-naming-strategy=SNAKE_CASE
# ========== 连接池配置（HikariCP，Spring Boot 默认） ==========
# 最小空闲连接数
spring.datasource.hikari.minimum-idle=5
# 最大连接数
spring.datasource.hikari.maximum-pool-size=20
# 空闲超时时间（毫秒）
spring.datasource.hikari.idle-timeout=600000
# 连接最大存活时间（毫秒）
spring.datasource.hikari.max-lifetime=1800000
# 连接超时时间（毫秒）
spring.datasource.hikari.connection-timeout=30000

# ========== MyBatis 核心配置 ==========
# 实体类别名包（简化 XML 中的 resultType 写法）
# mybatis.type-aliases-package=com.example.demo.entity
# Mapper XML 文件位置
mybatis.mapper-locations=classpath:mapper/*.xml

# ========== MyBatis 配置项 ==========
# 开启驼峰命名映射（user_name → userName）
mybatis.configuration.map-underscore-to-camel-case=true
# 开启二级缓存
mybatis.configuration.cache-enabled=true
# 懒加载
mybatis.configuration.lazy-loading-enabled=true
# 积极懒加载（多个关联对象同时加载）
mybatis.configuration.aggressive-lazy-loading=false
# 执行器类型：SIMPLE（默认）/ REUSE / BATCH
mybatis.configuration.default-executor-type=SIMPLE
# 超时时间（秒）
mybatis.configuration.default-statement-timeout=30
# 日志输出（打印 SQL 到控制台）
# mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
 

# ==================== 基础连接 ====================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=12
spring.data.redis.username=
spring.data.redis.password=
spring.data.redis.timeout=3000ms
spring.data.redis.connect-timeout=3000ms

# 默认就是 lettuce，可写可不写
spring.data.redis.client-type=lettuce

# ==================== Lettuce 连接池（可选） ====================
# 需要引入 commons-pool2
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=5000ms
spring.data.redis.lettuce.shutdown-timeout=100ms